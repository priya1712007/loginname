<!DOCTYPE html>
<html>
<head>
    <title>Login App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="signup()">Signup</button>

        <button onclick="login()">Login</button>

        <p id="msg"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
